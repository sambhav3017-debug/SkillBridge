<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="sb-white" x1="8" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E5E5" />
    </linearGradient>
    <linearGradient id="sb-crimson" x1="10" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2D2D" />
      <stop offset="100%" stop-color="#D41514" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(205,203,202,0.16)" stroke-width="1.5"/>
  <!-- Interlocking S logo paths scaled to 64x64: White x Laser Crimson -->
  <g transform="translate(12, 12) scale(1)">
    <path d="M31 12.5C28.5 8 22 6 16.5 8.6 11 11.2 10.5 17 15.5 19.6l9 4.4" stroke="url(#sb-white)" stroke-width="4.2" stroke-linecap="round" />
    <path d="M9 27.5C11.5 32 18 34 23.5 31.4 29 28.8 29.5 23 24.5 20.4l-9-4.4" stroke="url(#sb-crimson)" stroke-width="4.2" stroke-linecap="round" />
    <circle cx="20" cy="20" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
